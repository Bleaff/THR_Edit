[project]
name = "thr-control"
dynamic = ["version"]
description = "Unofficial editor for first-generation Yamaha THR guitar amplifiers (USB MIDI)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bleaff" }]
keywords = ["yamaha", "thr", "guitar", "amplifier", "midi", "sysex", "editor", "presets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "pydantic>=2.7",
    "PySide6-Essentials>=6.7",
    "numpy>=2",
    "platformdirs>=4",
    "sounddevice>=0.5; sys_platform != 'linux'",
]

[project.urls]
Homepage = "https://github.com/Bleaff/THR_Edit"
Issues = "https://github.com/Bleaff/THR_Edit/issues"

[project.optional-dependencies]
portaudio = ["sounddevice>=0.5"]  # Linux only: use PortAudio instead of the PipeWire tools

[project.scripts]
thr-control = "thr_control.cli:main"

[project.gui-scripts]
thr-control-gui = "thr_control.gui.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "sounddevice>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/thr_control/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thr_control"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/packaging", "/README.md", "/LICENSE", "/AGENTS.md", "/roadmap.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/thr_control/gui/style.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["mido.*", "rtmidi.*", "sounddevice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
